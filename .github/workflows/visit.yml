name: Visit site
on:
  schedule:
    - cron: "0 8 * * *"   # every day at 08:00 UTC
  workflow_dispatch:       # lets you run it manually
jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Request the site
        run: curl -sS -L -A "Mozilla/5.0" -o /dev/null -w "%{http_code}\n" http://ajayidaniel.gt.tc
